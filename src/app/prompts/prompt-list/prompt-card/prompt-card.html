<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="mb-0">{{prompt().title}} </h3>
      <div class="text-sm text-color-secondary">
      &#64;{{prompt().title}} par {{prompt().author.username}}
      </div>
    </div>
    <div class="flex gap-2">
    <p-button icon="pi pi-pencil" [text]="true" sizes="small"/>
    <p-button icon="pi pi-copy" [text]="true" sizes="small"/>
  </div>

  </div>
  <textarea pTextarea readonly class="w-full mb-2" rows="8">{{prompt().content}}</textarea>
  <div class="flex justify-content-between align-items-center">
    <!-- <p-tab [value]="prompt().category.name" severity="secondary"/>-->
    <div class="flex gap-2 align-items-center">
      <p-button icon="pi pi-thumbs-up" size="small"/>
      <span>{{prompt().score}}</span>
      <p-button severity="secondary" icon="pi pi-thumbs-down" size="small"/>
    </div>
  </div>
</p-card>
